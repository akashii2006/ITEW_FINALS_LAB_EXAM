<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviews | BrewBox Coffee Co.</title>

  <!-- Bootstrap CSS: the styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Our own CSS -->
  <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- ==================== HEADER + NAVBAR (same on every page) ==================== -->
  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">☕ BrewBox</a>
        <!-- Menu icon for small screens: opens/closes the element with id="menu" -->
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link active" href="reviews.html" aria-current="page">Reviews</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="container my-5">
      <h1 class="mb-4">Customer Reviews</h1>
      <div class="row g-4">
        <!-- Reviews are added here by script.js -->
        <section class="col-lg-7" id="reviewList" aria-label="Customer reviews"></section>

        <section class="col-lg-5">
          <div class="card p-4">
            <h2 class="h4">Write a Review</h2>
            <form id="reviewForm">
              <div class="mb-3">
                <label class="form-label" for="revName">Name</label>
                <input type="text" class="form-control" id="revName" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="revRating">Rating</label>
                <select class="form-select" id="revRating" required>
                  <option value="">Choose...</option>
                  <option value="5">5 - Excellent</option>
                  <option value="4">4 - Good</option>
                  <option value="3">3 - Okay</option>
                  <option value="2">2 - Poor</option>
                  <option value="1">1 - Terrible</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="revText">Your Review</label>
                <textarea class="form-control" id="revText" rows="4" required></textarea>
              </div>
              <button class="btn btn-dark w-100" type="submit">Submit Review</button>
            </form>
          </div>
        </section>
      </div>
    </section>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <small>&copy; 2026 BrewBox Coffee Co. | Los Baños, Laguna, Philippines</small>
  </footer>

  <!-- Bootstrap JS (menu, carousel, cart panel, pop-up) and jQuery. Both are needed. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Our own jQuery code (must come AFTER jQuery and Bootstrap) -->
  <script src="script.js"></script>
</body>
</html>
